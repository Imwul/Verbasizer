<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5ed">
  <meta name="description" content="한 글 또는 두 글을 어절, 구절, 줄 단위로 잘라 섞는 한국어 컷업 작업실">
  <title>Verbasizer 한국어판</title>
  <link rel="stylesheet" href="styles.css">
  <script src="cutup.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Verbasizer</span>
        <small>한국어판</small>
      </div>
      <a class="source-link" href="https://www.youtube.com/watch?v=x3IKLMgFaDA" target="_blank" rel="noopener noreferrer">보위의 시연<span class="visually-hidden"> (새 창)</span></a>
    </header>

    <main>
      <section class="intro" aria-labelledby="intro-title">
        <div class="intro-copy">
          <h1 id="intro-title">문장을 잘라<br>다시 잇다</h1>
          <p>데이비드 보위의 컷업 기법을 한국어로.<br>우연히 만난 문장에서 다음 한 줄을 찾아보세요.</p>
        </div>
        <div class="paper-art" aria-hidden="true">
          <div class="paper-guide"></div>
          <span class="strip strip-first">서로의 발소리를</span>
          <span class="strip strip-second">기다렸다</span>
          <span class="strip strip-third">불이 꺼진 극장에서</span>
          <span class="strip strip-fourth">우리는</span>
        </div>
      </section>

      <div class="studio">
        <form id="studio-form" class="panel input-panel" aria-labelledby="source-title">
          <div class="panel-header">
            <h2 id="source-title">원문</h2>
            <div class="source-actions">
              <button id="sample-button" class="text-button" type="button">예문 불러오기</button>
              <button id="toggle-source" class="source-toggle" type="button" aria-expanded="false" aria-controls="second-source-group">두 글 섞기</button>
            </div>
          </div>

          <div class="source-fields">
            <div class="source-field">
              <label id="source-label" class="source-label visually-hidden" for="source">원문</label>
              <div class="source-box">
                <textarea id="source" rows="6" spellcheck="false" placeholder="섞고 싶은 글을 붙여 넣으세요."></textarea>
                <div class="source-tools">
                  <span id="source-count">0자</span>
                  <button id="clear-button" class="text-button" type="button" aria-label="첫 번째 원문 비우기">비우기</button>
                </div>
              </div>
            </div>
            <div id="second-source-group" class="source-field" hidden>
              <label class="source-label" for="second-source">두 번째 원문</label>
              <div class="source-box">
                <textarea id="second-source" rows="6" spellcheck="false" placeholder="첫 번째 글과 섞을 원문을 붙여 넣으세요."></textarea>
                <div class="source-tools">
                  <span id="second-source-count">0자</span>
                  <button id="clear-second-button" class="text-button" type="button" aria-label="두 번째 원문 비우기" disabled>비우기</button>
                </div>
              </div>
            </div>
          </div>

          <div class="settings">
            <fieldset class="cut-settings" aria-describedby="unit-help">
              <legend>자를 단위</legend>
              <div class="segments">
                <label><input type="radio" name="mode" value="word"><span>어절</span></label>
                <label><input type="radio" name="mode" value="phrase" checked><span>구절</span></label>
                <label><input type="radio" name="mode" value="line"><span>줄</span></label>
              </div>
            </fieldset>
            <div class="line-settings">
              <label for="line-count">최대 결과 줄 수</label>
              <div class="select-box">
                <select id="line-count" name="lineCount">
                  <option value="1">1줄</option>
                  <option value="2">2줄</option>
                  <option value="3">3줄</option>
                  <option value="4">4줄</option>
                  <option value="5">5줄</option>
                  <option value="6" selected>6줄</option>
                  <option value="7">7줄</option>
                  <option value="8">8줄</option>
                  <option value="9">9줄</option>
                  <option value="10">10줄</option>
                  <option value="11">11줄</option>
                  <option value="12">12줄</option>
                </select>
              </div>
            </div>
          </div>
          <p id="unit-help" class="unit-help">한 문장 안에서 이어지는 짧은 구절을 섞어요.</p>
          <p id="sources-help" class="sources-help" hidden>두 원문에 글을 넣으면 함께 섞을 수 있어요.</p>
          <button id="mix-button" class="mix-button" type="submit">
            <span class="mix-icon" aria-hidden="true"><i></i><i></i><i></i></span>
            잘라 섞기
          </button>
        </form>

        <section class="panel output-panel" aria-labelledby="output-title">
          <div class="panel-header">
            <h2 id="output-title">섞은 글</h2>
            <button id="copy-button" class="copy-button" type="button" disabled>결과 복사</button>
          </div>
          <div class="result-sheet">
            <p id="empty-result" class="empty-result">원문을 넣고 잘라 섞으면 여기에 결과가 나와요.</p>
            <div id="result" class="result" hidden></div>
          </div>
          <div class="output-footer">
            <span id="result-count"></span>
          </div>
        </section>
      </div>

      <div class="studio-footer">
        <p id="notice" class="notice" role="status"></p>
        <p class="shortcut"><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>Enter</kbd>로 섞기</p>
      </div>
    </main>
  </div>
</body>
</html>
